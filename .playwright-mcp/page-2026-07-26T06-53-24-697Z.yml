      - code [ref=f33e76]: "Build a React + Tailwind button component called MattButton, matte-dark chip style: - 36px tall — medium (default) on the shadcn size scale — with a 10px radius and a small medium-weight label. - Surface is a flat matte fill with a 1px gradient border (light top edge fading to a darker bottom), plus an inset shadow so the face reads slightly recessed. - Three blurred elliptical glows pinned just under the top edge — white→violet→magenta, then the reverse, then a neutral haze — composited with mix-blend-mode: plus-lighter, so the top rim looks holographic. - One soft-light violet blur along the bottom edge for the bounce light. - Label and icon are painted with a horizontal gradient — gold → green → coral → teal in dark, and the same sweep held at oklch L .47 in light so it clears 4.5:1 on the pale face — the icon via a CSS mask so the mark takes the sweep too. - No shadow under the label or icon; the ink sits flat on the surface. - Light and dark themes are the same layers with swapped CSS custom properties. Light also swaps the rim's blend mode: plus-lighter reads as holographic on the dark face but adds nothing on the light one, which multiplies the same two hues into the surface instead. - Content: label \"github\", leading GitHub icon. - The icon box scales with the size (14px / 16px / 16px / 18px); icons are fitted with mask-size: contain, never with intrinsic dimensions. - Hover, on one expo-out curve (700ms in, 900ms out, disabled under prefers-reduced-motion): the chip lifts 1px, the rim glows and the ink gain, and dark brightens the face with them. - Presses scale to 0.97, focus-visible draws an offset outline (not a ring — the inset box-shadow owns that slot), and all native button props pass through."
