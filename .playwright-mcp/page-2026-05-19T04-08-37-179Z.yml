          - heading "D2 Studio" [level=1] [ref=e48]
          - paragraph [ref=e49]: D2 Studio is a collection of copy-and-paste React components, blocks, and utilities built with shadcn/ui, Tailwind CSS, and TypeScript. Everything is open source, accessible, and designed to be production-ready.
        - generic [ref=e50]:
          - heading "Installation" [level=2] [ref=e51]
          - paragraph [ref=e52]: Pull any component into your project using the shadcn CLI. Make sure you have the CLI initialized first.
          - code [ref=e54]: pnpm dlx shadcn@latest add @d2studio/hero-section
        - generic [ref=e55]:
          - heading "Quick Start" [level=2] [ref=e56]
          - paragraph [ref=e57]: Import the component in any page or layout. It works out of the box with shadcn's theme tokens.
          - code [ref=e59]: "import { HeroSection } from \"@/components/hero-section\"; export default function Home() { return <HeroSection />; }"
        - generic [ref=e60]:
